name: build-searxng-curlcffi

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
  schedule:
    # Weekly, to pick up upstream SearXNG (rolling releases, no tags).
    - cron: "23 4 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build-time self-checks are the test suite: a bad patch, a missing
      # package or a broken solver fails here instead of shipping.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/searxng-curlcffi:latest
            ghcr.io/${{ github.repository_owner }}/searxng-curlcffi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
